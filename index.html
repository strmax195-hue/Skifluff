<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyfluff</title>
<meta name="description" content="Skyfluff: run, jump and glide across a sky made of clouds.">
<link rel="icon" href="icon-512.png">
<style>
  :root { --ink:#16294d; --muted:#4b5d80; --accent:#2e6fc4; }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
         background:#eaf3ff; text-align:center; }
  .hero { background:url(banner-1920x1080.png) center/cover; min-height:56vw; max-height:620px; }
  main { max-width:720px; margin:-60px auto 40px; padding:28px; background:#fff; border-radius:24px;
         box-shadow:0 10px 40px rgba(20,50,110,.15); position:relative; }
  @media (max-width:600px){ main { margin:-30px 12px 32px; padding:20px 16px; } }
  img.icon { width:104px; height:104px; border-radius:24px; margin-top:-80px; box-shadow:0 8px 24px rgba(10,40,100,.25); }
  h1 { margin:10px 0 4px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="hero" role="img" aria-label="Skyfluff gameplay"></div>
<main>
  <img class="icon" src="icon-512.png" alt="Skyfluff icon">
  <h1>Skyfluff</h1>
  <p>Run, jump and glide across a sky made of clouds. Swipe to play!</p>
  <p><a href="privacy-policy.html">Privacy Policy</a></p>
</main>
</body>
</html>
